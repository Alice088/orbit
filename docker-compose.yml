services:

  db:
    container_name: orbit-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://orbit:orbit@db:5432/orbit?sslmode=disable"
      - "up"

  backend:
    build: .
    container_name: orbit-backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_READ_TIMEOUT: 10s
      SERVER_WRITE_TIMEOUT: 10s

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: orbit
      DB_PASSWORD: orbit
      DB_NAME: orbit
      DB_SSLMODE: disable

      LOG_LEVEL: info
      LOG_FORMAT: json

      JWT_SECRET_KEY: orbit-dev-secret-change-me
      JWT_ACCESS_EXPIRY: 24h
      JWT_REFRESH_EXPIRY: 168h

      GAME_TIMEZONE: Europe/Moscow
      GAME_DAILY_HABIT_CAP: 50
      GAME_MISSED_TWICE_PENALTY_XP: 3
      GAME_INACTIVITY_PENALTY_XP: 3
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: orbit-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"

volumes:
  pgdata:

networks:
  default:
    name: orbit_default
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
